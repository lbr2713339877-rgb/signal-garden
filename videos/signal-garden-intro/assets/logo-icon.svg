<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 深色背景（可选，取消注释即可） -->
  <!-- <rect width="100" height="100" fill="#030303"/> -->

  <!-- 外框：根据背景自适应颜色 -->
  <path
    d="M 20 10 L 80 10 L 80 80 L 28 80"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 断开处的渐隐线段 -->
  <path
    d="M 28 80 L 20 80 L 20 22"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
    opacity="0.2"
  />

  <!-- 内部玻璃切片 1：冷青 -->
  <path
    d="M 35 30 L 65 35 L 60 60 L 30 55 Z"
    fill="#73D9E8"
    fill-opacity="0.18"
    style="transform-origin: 50px 45px; transform: rotate(-8deg);"
  />

  <!-- 内部玻璃切片 2：雾蓝 -->
  <path
    d="M 40 35 L 65 40 L 62 65 L 37 60 Z"
    fill="#8997D6"
    fill-opacity="0.14"
  />

  <!-- 内部玻璃切片 3：薄荷 -->
  <path
    d="M 42 40 L 70 43 L 68 68 L 40 65 Z"
    fill="#9BC9A7"
    fill-opacity="0.12"
    style="transform-origin: 55px 54px; transform: rotate(5deg);"
  />

  <!-- 左边缘的冷青高光 -->
  <line
    x1="20"
    y1="22"
    x2="20"
    y2="10"
    stroke="#73D9E8"
    stroke-width="1.5"
    opacity="0.6"
  />

  <!-- 系统标注 SG -->
  <text
    x="72"
    y="90"
    fill="currentColor"
    opacity="0.4"
    font-size="8"
    font-family="sans-serif"
    font-weight="500"
    letter-spacing="0.14em"
  >SG</text>
</svg>
